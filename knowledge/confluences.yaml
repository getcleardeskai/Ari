# Confluence registry
#
# This is the living list of individual confluences that feed the model. Edit weights/status
# freely as we backtest — that's the whole point of this file being separate from the prose
# overview in model-overview.md. Terminology is ICT (Inner Circle Trader) style — see
# ict-glossary.md for full definitions of every concept referenced below.
#
# 2026-08-19: a batch of new confluences was added from glossary notes. Per trader's instruction
# ("ignore star/rating stuff, we will edit this later, just capture WHAT confluences exist"),
# these all default to weight 50 / status testing regardless of how the source material described
# their importance — weighting is deliberately deferred to a later pass.
#
# 2026-08-19 (later same day): midnight_deviation, ote, and volume_expansion_pattern marked
# `deprecated` — dropped per trader's decision. The discretion required to draw them consistently
# (manipulation-leg identification, OTE swing-point selection) was judged too inconsistent to
# build a model around. Pivoting to a trend-following approach built on the remaining structural
# ICT confluences (FVG/IFVG/BPR/OB/BB/RB/IRB/structure/liquidity) instead. Their docs
# (midnight-deviation-method.md, ote-method.md) are kept for reference, not deleted, in case any
# of it turns out useful later — but they are no longer part of the active model.
#
# Fields:
#   id          - short stable identifier (used in pinescript/backtests, don't rename casually)
#   name        - human readable name
#   category    - "anchor" (midnight level/deviation), "bias" (structure/trend, sets directional
#                 bias), "htf" (higher-timeframe zone), "ltf" (lower-timeframe refinement),
#                 "trigger" (entry-trigger condition), or "filter" (context/no-trade condition)
#   timeframe   - timeframe(s) this confluence is drawn on
#   description - what it is / how it's identified
#   weight      - 0-100, current importance in the model (start at 50 = unranked/neutral)
#   status      - active | testing | disabled | deprecated
#   notes       - free-form, running commentary (what we've observed testing it), each entry
#                 dated

version: 1
last_updated: 2026-08-19

confluences:
  - id: midnight_deviation
    name: Midnight Deviation
    category: anchor
    timeframe: 5m (marked at/after 00:00)
    description: >
      Price's deviation away from the midnight open level, marked using the 5-minute candle
      method described in midnight-deviation-method.md. Acts as the primary timing/anchor
      mechanism for entries — the model looks for this to align with a refined, scaled-down
      confluence zone.
    weight: 50
    status: deprecated
    notes:
      - "2026-08-19: full marking method has multiple cases (single reversal candle vs. a run of
         several same-color candles before the shift) — see midnight-deviation-method.md. Method
         still needs a worked chart example from the trader to fully lock in."
      - "2026-08-19: exact fib tool settings confirmed from chart screenshots — fixed level
         ladder (1, 0, -1, -2, -2.5, -3.25, -3.5, -4, -4.5, -5), reversed, no log scale, no
         extend. See midnight-deviation-method.md for the full breakdown and remaining open
         items (anchor mapping, upward projection) before this gets coded into Pine Script."
      - "2026-08-19: math fully resolved — anchor mapping (0=near wick, 1=far wick), single fib
         tool (not two), and the level meaning: 1 to -2.5 = pullback/S-R zone, -3.25 to -5 =
         reversion/big-move zone. Only remaining blockers are the 00:00 timezone/session
         definition and the trend-day variant. Once those close, this is ready for Pine Script."
      - "2026-08-19: there is a second, more discretionary way to draw this — 'Method B',
         off a manipulation leg (higher-low/lower-high before or after a big move at midnight)
         instead of the candle-run high/low. See midnight-deviation-method.md. Also: higher
         levels = higher probability but this is explicitly discretionary (e.g. trader passed on
         a 'perfect' -5 level because of concerning pre-level volume) — do not treat as a pure
         mechanical trigger."
      - "2026-08-19: level ladder updated/expanded to 16 levels (was 10) — now
         1, 0.705, 0.5, 0, -1, -1.5, -2, -2.25, -2.5, -3, -3.25, -3.5, -4, -4.25, -4.5, -5.
         Pullback zone extended to 1..-2.5, reversion zone is -3..-5. See
         midnight-deviation-method.md for the current authoritative table (supersedes the
         original 10-level version noted above)."

  - id: market_structure
    name: Market Structure (Bias / BOS / CHoCH)
    category: bias
    timeframe: primarily Daily, referenced down the ladder
    description: >
      Break of Structure (BOS) and Change of Character (CHoCH) used to determine current trend
      and directional bias before looking for entries. E.g. a daily timeframe in a sustained
      uptrend sets a bullish bias for the top-down search.
    weight: 70
    status: testing
    notes:
      - "2026-08-19: trader called this out as probably the single biggest factor since it sets
         bias for everything else — starting weight set above neutral (50) on that basis, pending
         actual backtest evidence."
      - "2026-08-19: glossary clarified BOS vs CHoCH/MSS more precisely than this entry's name
         implies — BOS breaks a swing high/low (continuation confirmation), while MSS/COS breaks
         the most recent Protected High/Low specifically (reversal signal). See ict-glossary.md
         and the new change_of_structure entry below; consider splitting BOS and MSS into
         separate confluence entries once we're ready to code them distinctly."

  - id: previous_session_liquidity
    name: Previous Session High/Low (Liquidity)
    category: htf
    timeframe: Daily (previous day/session reference)
    description: >
      Previous session's authority/liquidity levels — prior day/session highs and lows — used
      as HTF reference points for where price is likely drawn to or reacts from.
    weight: 50
    status: testing
    notes: []

  - id: fair_value_gap
    name: Fair Value Gap (FVG)
    category: htf
    timeframe: ladder (Daily -> 4H -> 1H -> 45m -> 30m -> 15m -> 5m)
    description: >
      Standard ICT FVG — a 3-candle imbalance left in price. Used both as an HTF area of interest
      and refined down through the timeframe ladder.
    weight: 50
    status: testing
    notes: []

  - id: inverse_fair_value_gap
    name: Inverse Fair Value Gap (iFVG)
    category: htf
    timeframe: ladder (Daily -> 4H -> 1H -> 45m -> 30m -> 15m -> 5m)
    description: >
      An FVG that has been violated/flipped and now acts as support/resistance in the opposite
      direction of its original polarity.
    weight: 50
    status: testing
    notes: []

  - id: balanced_price_range
    name: Balanced Price Range (BPR)
    category: htf
    timeframe: ladder (Daily -> 4H -> 1H -> 45m -> 30m -> 15m -> 5m)
    description: >
      Overlap of two opposing FVGs (one bullish, one bearish) left behind by a sharp move and
      reversal — treated as a high-probability reaction zone.
    weight: 50
    status: testing
    notes: []

  - id: rejection_block
    name: Rejection Block
    category: htf
    timeframe: ladder (Daily -> 4H -> 1H -> 45m -> 30m -> 15m -> 5m)
    description: >
      Zone marked by long wicks rejecting a level, showing where aggressive buying/selling
      pressure previously stepped in.
    weight: 50
    status: testing
    notes: []

  - id: order_block
    name: Order Block
    category: htf
    timeframe: ladder (Daily -> 4H -> 1H -> 45m -> 30m -> 15m -> 5m)
    description: >
      Last opposing candle before a significant/impulsive move — classic ICT order block, used
      as an area where large orders are presumed to sit.
    weight: 50
    status: testing
    notes: []

  - id: volume_spike_reaction
    name: Volume Spike Reaction at Level
    category: trigger
    timeframe: entry timeframe (5m or lower, TBD)
    description: >
      There is no fixed R:R entry rule in this model. Instead, the actual trigger to enter is an
      immediate, high-volume spike/reaction occurring at or around a level where the midnight
      deviation aligns with a refined confluence zone. Without this reaction, no entry is taken
      even if the levels line up.
    weight: 60
    status: testing
    notes:
      - "2026-08-19: this is the actual entry trigger per the trader, not just a supporting
         confluence — weighted above neutral pending backtest data."

  - id: exit_htf_support_resistance
    name: Exit via HTF Support/Resistance
    category: filter
    timeframe: HTF confluence zones
    description: >
      No fixed take-profit rule. Exit is managed against higher-timeframe support/resistance
      confluence zones around the trade, or on signs of price reversing against the position.
      This governs trade management, not entry.
    weight: 50
    status: testing
    notes:
      - "2026-08-19: originally framed around midnight-deviation levels specifically; reworded
         after midnight_deviation was deprecated. The general principle (manage exits against
         other confluence zones / reversal signs, no fixed TP) still holds independent of
         midnight-dev."

  - id: ote
    name: OTE (Optimal Trade Entry)
    category: ltf
    timeframe: drawn on whatever swing leg is judged relevant (session highs/lows, e.g. NY AM)
    description: >
      ICT-style fib retracement drawn across a swing low-to-high (or reversed), used to refine
      entries to a tight point, ideally where it lines up ("connects") with a midnight deviation
      level or another confluence (e.g. a rejection block's 0.5). See ote-method.md for full
      detail — swing-point selection is highly discretionary.
    weight: 55
    status: deprecated
    notes:
      - "2026-08-19: trader-supplied probability ranking is 0.78 (highest) > 0.66/0.7 > 0.62
         (lowest) — note this differs from textbook ICT convention (0.62 sweet spot); we go with
         the trader's own field-data ranking. Flagged as the hardest confluence to automate
         cleanly since swing-point selection is pure discretion — see ote-method.md."

  - id: news_filter
    name: No-News Filter
    category: filter
    timeframe: n/a (time-based blackout)
    description: >
      Hard no-trade rule around news events — repeatedly stressed by the trader. Implementation
      approach not yet decided (manual high-impact time input vs. known recurring schedule vs.
      external feed). See midnight-deviation-method.md "Do not trade news" section.
    weight: 80
    status: testing
    notes:
      - "2026-08-19: trader stresses this 'again and again' — weighted high as a hard filter, not
         a soft-scored confluence, even though the field/schema treats all entries uniformly for
         now. Revisit whether filter-category confluences need a separate 'hard block' mechanism
         distinct from the 0-100 weight scale used for scoring confluences."

  - id: volume_expansion_pattern
    name: Small Drawdown / Large Expansion Pattern
    category: filter
    timeframe: entry timeframe (5m or lower)
    description: >
      Observed pattern where a relatively small adverse move (drawdown) at a level precedes a
      much larger expansion move — associated with high-volume/news-driven conditions. Example
      data points: ~15 tick drawdown -> ~500 tick expansion (midnight dev alone); ~5 tick
      drawdown -> ~700 tick expansion (OTE + rejection block 0.5 confluence). Anecdotal so far —
      log dated instances in examples.md as they occur.
    weight: 50
    status: deprecated
    notes:
      - "2026-08-19: only two anecdotal data points so far, not yet statistically validated."

  - id: protected_high_low
    name: Protected Low/High + Catalyst (PLC / PHC / PL / PH)
    category: trigger
    timeframe: same TF the PDA it's layered on is drawn on
    description: >
      Confirmation model layered on any valid PDA (FVG, IFVG, BPR, etc). Bullish: first rejection
      off the PDA = Protected Low Catalyst (PLC); a later higher low off the same PDA = Protected
      Low (PL). Bearish mirrored: Protected High Catalyst (PHC) then Protected High (PH). Waiting
      for PL/PH confirmation instead of entering on first touch raises probability. See
      ict-glossary.md.
    weight: 50
    status: testing
    notes:
      - "2026-08-19: source material calls this one of the highest-probability entry models, but
         also explicitly not a standalone decider — still requires correct premium/discount
         positioning and trend/structure alignment. Weight left at default per instruction to
         defer rating; revisit once backtest data exists."

  - id: inverse_rejection_block
    name: Inverse Rejection Block (IRB)
    category: htf
    timeframe: ladder (Daily -> 4H -> 1H -> 45m -> 30m -> 15m -> 5m)
    description: >
      Forms when price breaks through a previously respected Rejection Block, flipping its role
      (old support becomes resistance, or vice versa). High-probability continuation area after a
      shift in order flow. See ict-glossary.md.
    weight: 50
    status: testing
    notes: []

  - id: breaker_block
    name: Breaker Block (BB)
    category: htf
    timeframe: ladder (Daily -> 4H -> 1H -> 45m -> 30m -> 15m -> 5m)
    description: >
      Forms when an Order Block fails and price breaks through it, flipping its role — same
      pattern as IFVG/IRB. Strong continuation entry after a change in market structure. See
      ict-glossary.md.
    weight: 50
    status: testing
    notes: []

  - id: change_of_structure
    name: Change of Structure / Market Structure Shift (COS / MSS)
    category: bias
    timeframe: primarily Daily, referenced down the ladder
    description: >
      Occurs when price breaks the most recent Protected Low (bullish trend) or Protected High
      (bearish trend) — signals the current trend may be ending, control shifting, reversal or
      deeper retrace more likely. Distinct from BOS (see market_structure) which confirms
      continuation rather than reversal. See ict-glossary.md.
    weight: 50
    status: testing
    notes:
      - "2026-08-19: split out from market_structure for precision since BOS (continuation) and
         MSS/COS (reversal) are triggered by different conditions (swing high/low vs. Protected
         High/Low). Consider whether market_structure should be renamed to just cover BOS once
         both are actually coded."
      - "2026-08-19: confirmed via reference diagram that ChoCH (Change of Character) is the same
         signal as MSS/COS, just alternate naming — not a separate confluence. This id covers all
         three names."

  - id: range_settlement
    name: Range Settlement (RS)
    category: filter
    timeframe: TBD
    description: >
      Confirms where the market is likely to expand next after price finishes building liquidity
      within a defined range. Key idea: wait for acceptance/settlement outside the range rather
      than assuming the first breakout is valid. Used to validate breakout direction before
      looking for continuation entries into PDAs. See ict-glossary.md.
    weight: 50
    status: testing
    notes: []

  - id: short_term_high_low
    name: Short-Term High / Low (STH / STL)
    category: ltf
    timeframe: smallest structure timeframe in use
    description: >
      Smallest form of market structure — a high/low the immediately surrounding candles fail to
      exceed. Creates short-term liquidity (stops cluster above STH / below STL). More
      significant near a PDA or premium/discount zone. See ict-glossary.md.
    weight: 50
    status: testing
    notes: []

  - id: intermediate_term_high_low
    name: Intermediate-Term High / Low (ITH / ITL)
    category: htf
    timeframe: built from multiple STH/STL
    description: >
      Larger structure formed from multiple STHs/STLs — a high with STHs on both sides (ITH) or a
      low with STLs on both sides (ITL). Represents a larger liquidity pool than a single STH/STL.
      See ict-glossary.md.
    weight: 50
    status: testing
    notes:
      - "2026-08-19: reference diagram shows a further tier above this — Long-Term High/Low
         (LTH/LTL), built from multiple ITH/ITL the same way ITH/ITL is built from STH/STL. Not
         yet added as its own confluence entry — see 'Long-Term High / Low' in ict-glossary.md;
         may end up as a parameterization of this same detection logic rather than a separate id."

  - id: external_range_liquidity
    name: External Range Liquidity (ERL)
    category: htf
    timeframe: n/a (liquidity concept, not TF-specific)
    description: >
      Liquidity resting outside a defined trading range — above a significant high (BSL) or below
      a significant low (SSL). Price often expands toward ERL to take those stops, then reverses
      or continues depending on context. See ict-glossary.md.
    weight: 50
    status: testing
    notes: []

  - id: internal_range_liquidity
    name: Internal Range Liquidity (IRL)
    category: ltf
    timeframe: n/a (liquidity concept, not TF-specific)
    description: >
      Liquidity resting inside a defined range — at STHs, STLs, minor swing points, equal
      highs/lows. Often taken as a step toward external liquidity. See ict-glossary.md.
    weight: 50
    status: testing
    notes: []

  - id: premium_discount_zone
    name: Premium / Discount Zone (PDZ)
    category: filter
    timeframe: n/a (range-relative, computed from a significant high/low + 50% EQ)
    description: >
      Range split at the 50% equilibrium level. Upper half = Premium (look for shorts at a
      bearish PDA); lower half = Discount (look for longs at a bullish PDA). See ict-glossary.md.
    weight: 50
    status: testing
    notes:
      - "2026-08-19: trader gave this as an unconditional hard rule — 'NEVER SELL IN DISCOUNT,
         NEVER BUY IN PREMIUM. NO EXCEPTIONS.' Weight left at default per instruction to defer
         rating, but flagging now: this reads as a hard block, not a soft-scored confluence, same
         as news_filter — worth deciding whether filter-category entries need a distinct
         hard-block mechanism rather than the 0-100 weight scale once we get to weighting."

# Add new confluences below as they're defined. Keep ids lowercase_snake_case.
